[project]
name = "deskpilot"
version = "0.1.0"
description = "Personal multi-agent boot orchestrator"
authors = [
    { name = "zfrnaa", email = "frantajudin@outlook.my" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deskpilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


