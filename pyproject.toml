[project]
name = "deskpilot"
version = "0.1.0"
description = "Personal multi-agent boot orchestrator"
authors = [
    { name = "zfrnaa", email = "frantajudin@outlook.my" }
]
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.200.0",
    "google-auth-oauthlib>=1.4.1",
    "langchain-core>=1.6.2",
    "langchain-google-genai>=4.4.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "langsmith>=0.12.0",
    "notion-client>=3.1.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
deskpilot = "deskpilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deskpilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


