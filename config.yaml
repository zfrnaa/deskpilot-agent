# DeskPilot Configuration File

# %TEMP% directory cleaner
temp_cleaner:
  enabled: true
  max_age_hours: 24
  temp_path: null
  # null defaults to Windows %TEMP%

# Floorp browser bookmark auditor (on-demand via menu option [3])
floorp:
  enabled: true
  profile_path: null

# Google Calendar morning agenda
calendar:
  enabled: true
  credentials_path: credentials.json
  token_path: token.json
  calendar_id: primary
  max_results: 20

# Notion workspace integration
notion:
  enabled: true
  token: ''
  parent_page_id: ''              # Legacy / fallback parent page
  read_later_database_id: ''      # "The Read Later List" newsfeed database ID
  screenshot_destinations:
    work_notes_database_id: ''    # Database ID for WorkNote (with dynamic schema introspection)
    due_diligence_page_id: ''     # Page ID for Due Diligence Questionnaire
    brainstorm_page_id: ''        # Page ID for Brainstorm Session

# Screenshots folder triage
screenshots:
  enabled: true
  directory: ~/Pictures/Screenshots
  delete_synced_local: true

# Downloads folder hygiene
downloads:
  enabled: true
  directory: ~/Downloads
  stale_days: 30

# Winget package updater & exclusions
winget:
  enabled: true
  timeout_secs: 15
  ignore_packages:
    - AdvancedSystemCare
    - RevoUninstallerPro
    - DriverBooster 

ollama:
  model: minicpm-v
  url: http://localhost:11434

# Morning news digest (curated topics: Tech, Malaysia, K-Pop/Music, Concerts, Art)
news:
  enabled: true

# Voice prompt notifications (Kokoro-ONNX neural TTS)
voice:
  enabled: true
  voice: af_bella    # af_bella, af_sarah, am_adam, am_michael
  speed: 1.0
  lang: en-us
  device: null       # null uses Windows default, or specify e.g. "Speaker" or "Corsair"


