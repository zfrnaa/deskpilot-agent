<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Geist', Roboto, sans-serif;">
  <defs>
    <!-- Grid pattern for subtle editorial paper background -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#21262d" />
    </pattern>
    <!-- Crisp directional arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#8b949e" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#58a6ff" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#3fb950" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#bc8cff" />
    </marker>
  </defs>

  <!-- Background Layer -->
  <rect width="1160" height="700" fill="#0d1117"/>
  <rect width="1160" height="700" fill="url(#grid)"/>

  <!-- Top Editorial Header & Metadata Strip -->
  <g transform="translate(48, 36)">
    <text x="0" y="0" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" font-weight="700" fill="#58a6ff" letter-spacing="2">SYSTEM TOPOLOGY - DUAL-LAYER ARCHITECTURE</text>
    <text x="0" y="24" font-size="22" font-weight="700" fill="#f0f6fc">DeskPilot Autonomous Orchestration Flow</text>
    <text x="0" y="44" font-size="12" fill="#8b949e">Layer 1: Sub-Second Boot &amp; Memory Hygiene  |  Layer 2: LangGraph HITL State Persistence &amp; Evaluations</text>
    
    <rect x="794" y="-12" width="270" height="26" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="808" cy="1" r="3.5" fill="#3fb950"/>
    <text x="820" y="5" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" fill="#c9d1d9">DUAL-LAYER PERSISTENCE - HITL VERIFIED</text>

    <line x1="0" y1="58" x2="1064" y2="58" stroke="#21262d" stroke-width="1.5"/>
  </g>

  <!-- ========================================== -->
  <!-- COLUMN 1: INGRESS & TOAST ACTIVATION       -->
  <!-- ========================================== -->
  <g transform="translate(48, 118)">
    <rect x="0" y="0" width="200" height="236" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect x="0" y="0" width="200" height="28" rx="6" fill="#1c2128"/>
    <text x="14" y="18" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#8b949e">01 INGRESS &amp; ACTIVATION</text>

    <!-- Trigger 1: Windows Logon + Toast -->
    <rect x="12" y="36" width="176" height="58" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="22" y="52" font-size="11" font-weight="600" fill="#f0f6fc">Windows Logon &amp; Toast</text>
    <text x="22" y="66" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#8b949e">register_startup.ps1</text>
    <text x="22" y="80" font-size="9" fill="#3fb950">deskpilot:// protocol URI</text>

    <!-- Trigger 2: Manual CLI -->
    <rect x="12" y="100" width="176" height="58" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="22" y="116" font-size="11" font-weight="600" fill="#f0f6fc">User Shell Command</text>
    <text x="22" y="130" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#8b949e">uv run deskpilot</text>
    <text x="22" y="144" font-size="9" fill="#c9d1d9">Interactive / --no-tui</text>

    <!-- Trigger 3: Background Daemon & Memory -->
    <rect x="12" y="164" width="176" height="60" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="22" y="180" font-size="11" font-weight="600" fill="#58a6ff">Daemon &amp; Memory CLI</text>
    <text x="22" y="194" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#8b949e">--daemon / --clear-ram</text>
    <text x="22" y="208" font-size="9" fill="#3fb950">Auto game &amp; memory watch</text>
  </g>

  <!-- Arrow: Ingress -> Orchestrator -->
  <path d="M 248 236 L 288 236" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ========================================== -->
  <!-- COLUMN 2: DESKPILOT CORE ORCHESTRATOR      -->
  <!-- ========================================== -->
  <g transform="translate(290, 118)">
    <rect x="0" y="0" width="190" height="236" rx="6" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="28" rx="6" fill="#1f293d"/>
    <text x="14" y="18" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#58a6ff">02 ORCHESTRATOR CORE</text>

    <text x="14" y="54" font-size="13" font-weight="700" fill="#f0f6fc">DeskPilot Engine</text>
    <text x="14" y="68" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#8b949e">deskpilot/cli.py</text>

    <!-- Core Specs list -->
    <rect x="12" y="78" width="166" height="146" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="22" y="96" font-size="10" font-weight="600" fill="#c9d1d9">• Zero-import Startup</text>
    <text x="22" y="110" font-size="9" fill="#8b949e">No heavy LLMs on boot</text>
    <text x="22" y="128" font-size="10" font-weight="600" fill="#c9d1d9">• Async Concurrency</text>
    <text x="22" y="142" font-size="9" fill="#8b949e">asyncio.gather loop</text>
    <text x="22" y="160" font-size="10" font-weight="600" fill="#3fb950">• RAMMap Memory Hook</text>
    <text x="22" y="174" font-size="9" fill="#8b949e">ntdll native memory list</text>
    <text x="22" y="192" font-size="10" font-weight="600" fill="#58a6ff">• Dual-Layer Execution</text>
    <text x="22" y="206" font-size="9" fill="#8b949e">Fast hygiene &lt;1s boot</text>
  </g>

  <!-- Arrow: Orchestrator -> Layer 1 -->
  <path d="M 480 236 L 518 236" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ========================================== -->
  <!-- COLUMN 3: LAYER 1 PARALLEL HYGIENE CHECKS  -->
  <!-- ========================================== -->
  <g transform="translate(520, 118)">
    <rect x="0" y="0" width="240" height="236" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect x="0" y="0" width="240" height="28" rx="6" fill="#1c2128"/>
    <text x="14" y="18" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#3fb950">03 LAYER 1: FAST BOOT (&lt;1S)</text>

    <!-- Task 1: Temp & Dumps Cleaner -->
    <rect x="12" y="34" width="216" height="42" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="49" font-size="10" font-weight="600" fill="#f0f6fc">%TEMP% &amp; Memory Dumps</text>
    <text x="20" y="63" font-size="9" fill="#8b949e">Purges &gt;24h files &amp; crash dumps</text>

    <!-- Task 2: Native RAM & Standby List Manager -->
    <rect x="12" y="82" width="216" height="44" rx="4" fill="#0d1117" stroke="#238636" stroke-width="1.5"/>
    <text x="20" y="97" font-size="10" font-weight="600" fill="#3fb950">RAM &amp; Standby List Purge</text>
    <text x="20" y="111" font-size="9" fill="#c9d1d9">Empty working sets &amp; flush pages</text>

    <!-- Task 3: Winget Checker -->
    <rect x="12" y="132" width="216" height="42" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="147" font-size="10" font-weight="600" fill="#f0f6fc">Winget Updates Check</text>
    <text x="20" y="161" font-size="9" fill="#8b949e">Exclusion filters for pinned software</text>

    <!-- Task 4: Calendar & Voice -->
    <rect x="12" y="180" width="216" height="44" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="195" font-size="10" font-weight="600" fill="#f0f6fc">Calendar &amp; Neural Voice</text>
    <text x="20" y="209" font-size="9" fill="#8b949e">Google Meet agenda + Kokoro TTS</text>
  </g>

  <!-- Arrow: Layer 1 -> Dashboard -->
  <path d="M 760 236 L 798 236" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ========================================== -->
  <!-- COLUMN 4: BENTO TUI & ACTION MENU [0-6]   -->
  <!-- ========================================== -->
  <g transform="translate(800, 118)">
    <rect x="0" y="0" width="312" height="236" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <rect x="0" y="0" width="312" height="28" rx="6" fill="#262117"/>
    <text x="14" y="18" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#e3b341">04 DASHBOARD &amp; MENU</text>

    <!-- Dashboard overview with Bento Grid -->
    <rect x="12" y="36" width="288" height="60" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="22" y="52" font-size="11" font-weight="600" fill="#f0f6fc">Textual Bento TUI / Rich Live</text>
    <text x="22" y="67" font-size="10" fill="#8b949e">Hygiene &amp; Storage | Winget | Agenda</text>
    <text x="22" y="82" font-size="9" fill="#58a6ff">Live LangSmith Diagnostics + Audio Briefing</text>

    <!-- Menu Router [0-6] -->
    <rect x="12" y="102" width="288" height="122" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="22" y="118" font-size="10" font-weight="600" fill="#e3b341">Action Menu [0-6]</text>
    <text x="22" y="134" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#c9d1d9">[1] Triage Screenshots   [2] Downloads Clean</text>
    <text x="22" y="150" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#c9d1d9">[3] Floorp Bookmarks     [4] Winget Upgrade</text>
    <text x="22" y="166" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#c9d1d9">[5] Read-Later Digest    [6] SystemCare Deep</text>
    <text x="22" y="182" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#8b949e">[0] Dismiss &amp; Exit</text>
    <text x="22" y="200" font-size="9" fill="#3fb950">Lazy-loads Layer 2 LangGraph state machines</text>
  </g>

  <!-- Connect Dashboard Menu down to Layer 2 Agents -->
  <path d="M 956 354 L 956 384 L 140 384 L 140 405" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-blue)"/>
  <text x="580" y="378" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" font-weight="600" fill="#58a6ff" text-anchor="middle">DYNAMIC DISPATCH: ON-DEMAND EXECUTION VIA USER SELECTION [0-6]</text>

  <!-- ======================================================== -->
  <!-- ROW 2: LAYER 2 AUTONOMOUS AGENTS & HITL PERSISTENCE     -->
  <!-- ======================================================== -->
  <g transform="translate(48, 410)">
    <!-- Container -->
    <rect x="0" y="0" width="1064" height="248" rx="6" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
    <rect x="0" y="0" width="1064" height="28" rx="6" fill="#1f293d"/>
    <text x="14" y="18" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" font-weight="700" fill="#58a6ff">05 LAYER 2: ON-DEMAND AGENTS &amp; STATE PERSISTENCE (LANGGRAPH + HITL)</text>

    <!-- Card 1: Screenshot Triage -->
    <rect x="14" y="38" width="200" height="196" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="24" y="58" font-size="12" font-weight="700" fill="#f0f6fc">[1] Screenshot Triage</text>
    <text x="24" y="74" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#8b949e">ReAct + Interceptor</text>
    <line x1="24" y1="82" x2="202" y2="82" stroke="#21262d" stroke-width="1"/>
    <text x="24" y="98" font-size="10" fill="#c9d1d9">• Gemini Vision Multimodal</text>
    <text x="24" y="114" font-size="10" fill="#c9d1d9">• Dynamic Schema Introspect</text>
    <text x="24" y="130" font-size="10" fill="#c9d1d9">• Multi-Route Notion Targets</text>
    <text x="24" y="146" font-size="10" fill="#388bfd">• Pydantic Tool Guardrails</text>
    <text x="24" y="162" font-size="10" fill="#bc8cff">• Adversarial Self-Correction</text>
    <text x="24" y="178" font-size="10" fill="#3fb950">• Safe Deletion (Only Synced)</text>
    <text x="24" y="194" font-size="9" fill="#8b949e">  WorkNotes | DD | Brainstorm</text>

    <!-- Card 2: Downloads Hygiene (Dual Layer HITL) -->
    <rect x="224" y="38" width="200" height="196" rx="4" fill="#0d1117" stroke="#238636" stroke-width="1.5"/>
    <text x="234" y="58" font-size="12" font-weight="700" fill="#f0f6fc">[2] Downloads Hygiene</text>
    <text x="234" y="74" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#3fb950">HITL Checkpointer</text>
    <line x1="234" y1="82" x2="412" y2="82" stroke="#21262d" stroke-width="1"/>
    <text x="234" y="98" font-size="10" fill="#c9d1d9">• Classify &amp; Stale Installer</text>
    <text x="234" y="114" font-size="10" fill="#c9d1d9">• Propose Action Plan</text>
    <text x="234" y="130" font-size="10" font-weight="600" fill="#3fb950">• MemorySaver Checkpointer</text>
    <text x="234" y="146" font-size="10" font-weight="600" fill="#e3b341">• interrupt_before Breakpoint</text>
    <text x="234" y="162" font-size="10" fill="#c9d1d9">• get_hygiene_state Inspect</text>
    <text x="234" y="178" font-size="10" fill="#58a6ff">• Time-Travel Resumption</text>
    <text x="234" y="194" font-size="9" fill="#8b949e">  (resume_downloads_hygiene)</text>

    <!-- Card 3: Floorp Bookmarks -->
    <rect x="434" y="38" width="195" height="196" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="444" y="58" font-size="12" font-weight="700" fill="#f0f6fc">[3] Floorp Bookmarks</text>
    <text x="444" y="74" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#8b949e">On-Demand Inspector</text>
    <line x1="444" y1="82" x2="617" y2="82" stroke="#21262d" stroke-width="1"/>
    <text x="444" y="98" font-size="10" fill="#c9d1d9">• places.sqlite Read-Only</text>
    <text x="444" y="114" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" fill="#8b949e">  immutable=1&amp;mode=ro</text>
    <text x="444" y="130" font-size="10" fill="#c9d1d9">• Zero Browser Lock Haz.</text>
    <text x="444" y="146" font-size="10" fill="#c9d1d9">• Duplicate &amp; UTM Scrubber</text>
    <text x="444" y="162" font-size="10" fill="#58a6ff">• 2x2 Dashboard Expansion</text>
    <text x="444" y="178" font-size="10" fill="#3fb950">• Safe Preview Mode</text>
    <text x="444" y="194" font-size="9" fill="#8b949e">  Non-destructive bookmark audit</text>

    <!-- Card 4: Winget & Read Later -->
    <rect x="639" y="38" width="195" height="196" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="649" y="58" font-size="12" font-weight="700" fill="#f0f6fc">[4 &amp; 5] System &amp; Notion</text>
    <text x="649" y="74" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#8b949e">Upgrade &amp; Read-Later</text>
    <line x1="649" y1="82" x2="822" y2="82" stroke="#21262d" stroke-width="1"/>
    <text x="649" y="98" font-size="10" font-weight="600" fill="#c9d1d9">[4] Winget Upgrade:</text>
    <text x="649" y="114" font-size="9" fill="#8b949e">• Respects ignore_packages</text>
    <text x="649" y="128" font-size="9" fill="#8b949e">• Interactive CLI helper</text>
    <text x="649" y="146" font-size="10" font-weight="600" fill="#c9d1d9">[5] Read-Later Digest:</text>
    <text x="649" y="162" font-size="9" fill="#8b949e">• Priority tags &amp; age rank</text>
    <text x="649" y="176" font-size="9" fill="#8b949e">• Curated today pick</text>
    <text x="649" y="192" font-size="9" fill="#3fb950">• 1-click status -&gt; read</text>

    <!-- Card 5: SystemCare Deep Clean & LangSmith Evals -->
    <rect x="844" y="38" width="206" height="196" rx="4" fill="#0d1117" stroke="#8957e5" stroke-width="1.5"/>
    <text x="854" y="58" font-size="12" font-weight="700" fill="#f0f6fc">[6] SystemCare &amp; Evals</text>
    <text x="854" y="74" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" fill="#bc8cff">Deep Clean &amp; Benchmarks</text>
    <line x1="854" y1="82" x2="1038" y2="82" stroke="#21262d" stroke-width="1"/>
    <text x="854" y="98" font-size="10" font-weight="600" fill="#c9d1d9">[6] SystemCare Clean:</text>
    <text x="854" y="112" font-size="9" fill="#8b949e">• Dev caches (npm, uv, pip)</text>
    <text x="854" y="126" font-size="9" fill="#8b949e">• Privacy traces &amp; MuiCache</text>
    <text x="854" y="142" font-size="10" font-weight="600" fill="#bc8cff">LangSmith Evals (--eval):</text>
    <text x="854" y="156" font-size="9" fill="#8b949e">• Deterministic benchmark</text>
    <text x="854" y="170" font-size="9" fill="#8b949e">• Isolated temp sandbox</text>
    <text x="854" y="184" font-size="9" fill="#58a6ff">• Safety &amp; HITL verification</text>
  </g>
</svg>